<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Evgeniy" />
    <meta name="description" content="Мастерская «Первый Мягкий»: изготавливаем дизайнерские диваны из премиальных тканей. Гарантия комфорта, индивидуальные
  размеры и современный стиль. Узнайте больше!" />
    <title>Каталог диванов</title>
    <!-- Гугл аналитика -->
    <!-- Google tag (gtag.js) -->

    <!-- ------------------------- -->
    <link rel="stylesheet" href="./src/assets/libs/fonts.css" />
    <link rel="stylesheet" href="./src/scss/style.scss" />

    <script type="module" src="/src/js/main.js"></script>
</head>

<body>

    <!-- оверлэй -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <!-- меню бургера -->
    <div class="menu-drawer" id="menu-drawer">
        <!-- <button class="close-btn" id="close-menu">
            <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="20">
                <path d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button> -->
        <a class="menu-item" href="/index.html">Главная</a>
        <nav class="menu-nav">
            <a class="menu-link" href="/catalog.html">Каталог</a>
            <a class="menu-link" href="/about.html">О нас</a>
            <a class="menu-link" href="/contacts.html">Контакты</a>
            <a class="menu-link" href="/conditions.html">Условия</a>
        </nav>
    </div>
    <!-- шапка -->
    <header class="header">
        <div class="nav-left">
            <!-- Главная с полосками -->
            <div class="menu-trigger">
                <div class="burger-icon">
                    <span></span>
                    <span></span>
                </div>
                <span>Главная</span>
            </div>
            <div class="nav-icons">
                <!-- <div class="icon-box" data-label="Корзина"> </div>
                <div class="icon-box" data-label="Профиль"> </div> -->
                <div class="icon-box" data-label="Поиск"> </div>
            </div>
        </div>
        <div class="logo-group">
            <a href="/index.html">
                <div class="logo" data-logo="main"></div>
            </a>
        </div>
    </header>

    <!-- =======================   Секция Catalog ========================== -->
    <section class="catalog-section container">
        <!-- тайтл -->
        <div class="catalog-content">
            <h1 class="catalog-title">КОЛЛЕКЦИЯ ДИВАНЫ '26-27</h1>
            <p class="catalog-desc">Мы действительно подошли к выбору невероятно мягчяйших тканей отобранные по всему
                миру.
            </p>
            <div>

            </div>
        </div>

        <!-- Мобильный триггер фильтра -->
        <div class="mobile-filter" id="mobile-filter">
            <div class="mobile-filter__trigger" id="filter-trigger">
                <svg class="mobile-filter__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6" />
                    <line x1="7" y1="12" x2="17" y2="12" />
                    <line x1="10" y1="18" x2="14" y2="18" />
                </svg>
                <span class="mobile-filter__label">Фильтр</span>
            </div>
        </div>
        
        <!-- Поп-ап фильтров -->
        <div class="filter-overlay" id="filter-overlay"></div>
        <div class="filter-popup" id="filter-popup">
            <div class="filter-popup__header">
                <span class="filter-popup__title">ФИЛЬТРЫ</span>
                <button class="filter-popup__close" id="filter-close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="filter-popup__list" id="filter-list">
                <div class="filter-popup__item" data-category="all">
                    <span class="filter-popup__name">Все диваны</span>
                    <div class="filter-popup__check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="12" fill="currentColor" />
                            <polyline points="7 12.5 10.5 16 17 9" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" fill="none" />
                        </svg>
                    </div>
                </div>
                <div class="filter-popup__item" data-category="corner">
                    <span class="filter-popup__name">Угловые</span>
                    <div class="filter-popup__check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="12" fill="currentColor" />
                            <polyline points="7 12.5 10.5 16 17 9" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" fill="none" />
                        </svg>
                    </div>
                </div>
                <div class="filter-popup__item" data-category="transformer">
                    <span class="filter-popup__name">Трансформер</span>
                    <div class="filter-popup__check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="12" fill="currentColor" />
                            <polyline points="7 12.5 10.5 16 17 9" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" fill="none" />
                        </svg>
                    </div>
                </div>
                <div class="filter-popup__item" data-category="book">
                    <span class="filter-popup__name">Книжка</span>
                    <div class="filter-popup__check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="12" fill="currentColor" />
                            <polyline points="7 12.5 10.5 16 17 9" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" fill="none" />
                        </svg>
                    </div>
                </div>
                <div class="filter-popup__item" data-category="bed">
                    <span class="filter-popup__name">Кровати</span>
                    <div class="filter-popup__check">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="12" fill="currentColor" />
                            <polyline points="7 12.5 10.5 16 17 9" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" fill="none" />
                        </svg>
                    </div>
                </div>
            </div>
            <div class="filter-popup__footer">
                <button class="filter-popup__btn filter-popup__btn--apply" id="filter-apply">Применить</button>
                <button class="filter-popup__btn filter-popup__btn--reset" id="filter-reset">Сбросить все</button>
            </div>
        </div>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab active" data-category="all">
                <img src="/src/assets/icons/catalog/angle.svg" class="tab__icon" alt="angle">
                <span class="catalog-title">Все диваны</span>
            </button>

            <button class="tab" data-category="corner">
                <img src="/src/assets/icons/catalog/angle.svg" class="tab__icon" alt="angle">
                <span class="catalog-title">Угловые</span>
            </button>

            <button class="tab" data-category="transformer">
                <img src="/src/assets/icons/catalog/big.svg" class="tab__icon" alt="big">
                <span class="catalog-title">Трансформер</span>
            </button>

            <button class="tab" data-category="book">
                <img src="/src/assets/icons/catalog/book.svg" class="tab__icon" alt="book">
                <span class="catalog-title">Книжка</span>
            </button>

            <button class="tab" data-category="bed">
                <img src="/src/assets/icons/catalog/angle.svg" class="tab__icon" alt="angle">
                <span class="catalog-title">Кровати</span>
            </button>
        </div>

        <!-- Контент с карточками -->

        <div class="catalog__wrapper" id="catalog"></div>

    </section>

    <!-- Template -->
    <template id="card-template">
        <a class="catalog__card" href="/product.html">
            <img />
    
            <div class="catalog__favorite"></div>
    
            <div class="catalog__colors">
                <span></span>
                <span></span>
                <span></span>
            </div>
    
            <div class="catalog__divider"></div>
    
            <div class="catalog__info">
                <div class="catalog__text">
                    <span class="catalog__card-title"></span>
                    <span class="catalog__desc"></span>
                </div>
                <span class="catalog__price"></span>
            </div>
        </a>
    </template>

</body>

</html>
