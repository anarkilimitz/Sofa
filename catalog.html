<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Evgeniy" />
    <meta name="description" content="Мастерская «Первый Мягкий»: изготавливаем дизайнерские диваны из премиальных тканей. Гарантия комфорта, индивидуальные
  размеры и современный стиль. Узнайте больше!" />
    <title>Каталог диванов</title>
    <link rel="stylesheet" href="./src/assets/libs/fonts.css" />
    <link rel="stylesheet" href="./src/scss/style.scss" />

    <script type="module" src="/src/js/main.js"></script>
</head>

<body>

    <!-- оверлэй -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <!-- меню бургера -->
    <div class="menu-drawer" id="menu-drawer">
        <button class="close-btn" id="close-menu">
            <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="20">
                <path d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <a class="menu-item" href="/index.html"><span class="menu-dot"></span>Главная</a>
        <nav class="menu-nav">
            <a class="menu-link" href="#">Каталог</a>
            <a class="menu-link" href="#">О нас</a>
            <a class="menu-link" href="#">Контакты</a>
            <a class="menu-link" href="#">Условия</a>
        </nav>
    </div>
    <!-- шапка -->
    <header class="header">
        <div class="nav-left">
            <!-- Главная с полосками -->
            <div class="menu-trigger">
                <div class="burger-icon">
                    <span></span>
                    <span></span>
                </div>
                <span>Главная</span>
            </div>
            <div class="nav-icons">
                <div class="icon-box" data-label="Корзина"> </div>
                <div class="icon-box" data-label="Профиль"> </div>
                <div class="icon-box" data-label="Поиск"> </div>
            </div>
        </div>
        <div class="logo-group">
            <div class="logo" data-logo="main"></div>
        </div>
    </header>

    <!-- =======================   Секция Catalog ========================== -->
    <section class="catalog-section container">
        <!-- тайтл -->
        <div class="catalog-content">
            <h1 class="catalog-title">КОЛЛЕКЦИЯ ДИВАНЫ '26-27</h1>
            <p class="catalog-desc">Мы действительно подошли к выбору невероятно мягчяйших тканей отобранные по всему
                миру.
            </p>
            <div>

            </div>
        </div>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab active" data-category="all">
                <img src="/src/assets/icons/catalog/angle.svg" class="tab__icon" alt="angle">
                <span class="catalog-title">ВСЕ ДИВАНЫ</span>
            </button>

            <button class="tab" data-category="corner">
                <img src="/src/assets/icons/catalog/angle.svg" class="tab__icon" alt="angle">
                <span class="catalog-title">УГЛОВЫЕ</span>
            </button>

            <button class="tab" data-category="transformer">
                <img src="/src/assets/icons/catalog/big.svg" class="tab__icon" alt="big">
                <span class="catalog-title">ТРАНСФОРМЕР</span>
            </button>

            <button class="tab" data-category="book">
                <img src="/src/assets/icons/catalog/book.svg" class="tab__icon" alt="book">
                <span class="catalog-title">КНИЖКА</span>
            </button>

            <button class="tab" data-category="bed">
                <img src="/src/assets/icons/catalog/angle.svg" class="tab__icon" alt="angle">
                <span class="catalog-title">КРОВАТИ</span>
            </button>
        </div>

        <!-- Контент с карточками -->

        <div class="catalog__wrapper" id="catalog"></div>

    </section>

    <!-- Template -->
    <template id="card-template">
        <a class="catalog__card">
            <img />
    
            <div class="catalog__favorite"></div>
    
            <div class="catalog__colors">
                <span></span>
                <span></span>
                <span></span>
            </div>
    
            <div class="catalog__divider"></div>
    
            <div class="catalog__info">
                <div class="catalog__text">
                    <span class="catalog__card-title"></span>
                    <span class="catalog__desc"></span>
                </div>
                <span class="catalog__price"></span>
            </div>
        </a>
    </template>

</body>

</html>
