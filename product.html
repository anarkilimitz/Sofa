    <!-- =======================   Секция Product ========================== -->

    <main class="product__page container">
        <section class="product__info">
            <h1 class="product__title">
                <a href="/catalog.html" class="product__title-back" id="prod-title">
                    <img src="/src/assets/icons/products/linkBack.svg" alt="Назад" class="product__title-icon">
                    тоскана
                </a>
            </h1>
            <!-- Аккордеон -->
            <div class="accordion">
                <div class="accordion__item accordion__item-active">
                    <button class="accordion__header">Описание</button>
                    <div class="accordion__content">
                        <p id="prod-description"></p>
                    </div>
                </div>

                <div class="accordion__item accordion__item-active">
                    <button class="accordion__header">Материалы</button>
                    <div class="accordion__content">
                        <p id="prod-materials"></p>
                    </div>
                </div>

                <div class="accordion__item accordion__item-active">
                    <button class="accordion__header">Цвета</button>
                    <div class="accordion__content">
                        <div class="color-select" id="colorPicker">
                            <div class="color-select__selected">
                                <span class="color-select__name">Мятное спокойствие</span>
                            </div>

                            <div class="color-select__dropdown">

                                <h3 class="product__title-color">Ткани и цвета</h3>
                                <div class="color-select__option" data-name="Первый мягкий"
                                    data-icon="/icons/product/textile/textile-blue.jpg">
                                    <span>Первый мягкий</span>
                                    <div class="color-select__swatch">
                                        <img src="/icons/product/textile/textile-blue.jpg" loading="lazy" />
                                    </div>
                                </div>
                                <div class="color-select__option" data-name="Гранитный камень"
                                    data-icon="/icons/product/textile/textile-grey.jpg">
                                    <span>Гранитный камень</span>
                                    <div class="color-select__swatch">
                                        <img src="/icons/product/textile/textile-grey.jpg" loading="lazy" />
                                    </div>
                                </div>
                                <div class="color-select__option" data-name="Буря в пустыне"
                                    data-icon="/icons/product/textile/textile-softgrey.jpg">
                                    <span>Буря в пустыне</span>
                                    <div class="color-select__swatch">
                                        <img src="/icons/product/textile/textile-softgrey.jpg" loading="lazy" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion__item accordion__item-active">
                    <button class="accordion__header">Параметры</button>
                    <div class="accordion__content">
                        <ul class="params-list" id="prod-params"> </ul>
                    </div>
                </div>
            </div>
        </section>
        <!-- Галерея -->
        <section class="product-gallery">
            <div class="gallery-grid" id="prod-gallery"></div>

                    </div>
                </a>
